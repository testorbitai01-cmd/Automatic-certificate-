# Production-like stack. Secrets come from .env (see .env.example), never from this file.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: gradtwin_certificates
      POSTGRES_USER: gradtwin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gradtwin -d gradtwin_certificates"]
      interval: 5s
      retries: 10

  # DOCX -> PDF converter (Gotenberg + LibreOffice). Internal only: no published port and no internet
  # access (the "converter" network is internal), so LibreOffice cannot fetch remote content.
  pdf:
    image: gotenberg/gotenberg:8
    command: ["gotenberg", "--chromium-disable-javascript=true", "--api-timeout=60s", "--log-level=warn"]
    networks: [converter]
    read_only: true
    tmpfs: ["/tmp", "/home/gotenberg"]
    security_opt: ["no-new-privileges:true"]

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://gradtwin:${POSTGRES_PASSWORD}@db:5432/gradtwin_certificates
      PRIVATE_STORAGE_ROOT: /srv/gradtwin/private
      PDF_CONVERTER_URL: http://pdf:3000
    volumes:
      - private:/srv/gradtwin/private
    depends_on:
      db:
        condition: service_healthy
      pdf:
        condition: service_started
    networks: [backend, converter, default]
    ports:
      - "127.0.0.1:8000:8000"

  # Phase 7 adds the background worker.

networks:
  backend:
    internal: true
  converter:
    internal: true

volumes:
  pgdata:
  private:
